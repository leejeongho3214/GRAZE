data_obj_pc_path: "data/hot3d/dataset/obj.pkl"
instance_json: "data/hot3d/previous/instance.json"
pre_process_mesh_dir: "data/hot3d/pre-process"

balance_weights_path: "data/hot3d/balance_weights.pkl"
text_json: "benchmark/hot3d_grasp/text.json"
t2l_json: "data/hot3d/text_length.json"
t2c_json: "data/hot3d/text_count.json"
flat_hand: False
max_nframes: 99
data_ratio: 1
augm: False
